apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: kind
nodes:
- role: control-plane
  image: kindest/node:v1.33.0
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraMounts:
  - hostPath: /
    containerPath: /mnt/root
# Ports are forwarded on demand using a container.
  extraPortMappings:
  #- hostPort: 30100
  #  containerPort: 30100
  #  protocol: TCP
  #- hostPort: 4317
  #  containerPort: 4317
  #- hostPort: 4318
  #  containerPort: 4318
- role: worker
  image: kindest/node:v1.33.0
  extraMounts:
  - hostPath: /
    containerPath: /mnt/root
- role: worker
  image: kindest/node:v1.33.0
  extraMounts:
  - hostPath: /
    containerPath: /mnt/root
- role: worker
  image: kindest/node:v1.33.0
  extraMounts:
  - hostPath: /
    containerPath: /mnt/root